# The AdventureWorks Sales Power BI report, declared through its committed specification.
#
# The report's model reads the AdventureWorksDW2022 database that deploy/compose's adventureworks-init service
# restores as `AdventureWorks`, so seven of its eight model tables resolve to real warehouse tables
# (dbo.DimCustomer, dbo.FactResellerSales, ...). The eighth, `Table`, is a report-local sort helper sourced via
# Json.Document and is reported unresolved by design.
#
# Regenerate the specification after changing the .pbix (git-ignored under samples/powerbi):
#
#   sqlflow powerbi extract "samples/powerbi/AdventureWorks Sales.pbix" \
#     --out "samples/powerai-adventureworks/reports/AdventureWorks Sales.pbix.yaml"

connections:
  aw: ${env:SQLFLOW_ADVENTUREWORKS_DB}

subscribers:
  AdventureWorks_Sales:
    type: PowerBI
    owner: analytics@example.com
    description: Reseller sales by product, region and date, from the AdventureWorks Sales sample report
    server: aw
    pbix: reports/AdventureWorks Sales.pbix.yaml
